name: Format embedded Eaglercraft payloads

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-single-thread.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Format HTML and embedded payloads safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          # Keep embedded binary payloads intact, but wrap their Base64 text
          # so the HTML source is readable instead of one enormous line.
          payload_pattern = re.compile(
              r'(<script\b[^>]*type="application/octet-stream"[^>]*>\n)(.*?)(</script>)',
              re.DOTALL,
          )

          def wrap_payload(match):
              opening, payload, closing = match.groups()
              compact = "".join(payload.split())
              if not compact:
                  return match.group(0)
              lines = "\n".join(compact[i:i + 76] for i in range(0, len(compact), 76))
              return opening + lines + "\n" + closing

          formatted, payload_count = payload_pattern.subn(wrap_payload, html)
          if payload_count < 1:
              raise SystemExit("No embedded application/octet-stream payloads found.")

          # Ensure the main startup configuration is consistent with single-thread mode.
          worker_pattern = re.compile(
              r'(?m)^([ \t]*singleThreadMode:[ \t]*true,\n)'
              r'[ \t]*serverWorker:[ \t]*[^\n]+\n'
              r'[ \t]*meshWorkers:[ \t]*[^\n]+(?:\n[ \t]*&&[^\n]+)?'
          )

          def fix_workers(match):
              indent = re.match(r'[ \t]*', match.group(1)).group(0)
              return match.group(1) + indent + 'serverWorker: false,\n' + indent + 'meshWorkers: false'

          formatted, worker_count = worker_pattern.subn(fix_workers, formatted, count=1)
          if worker_count != 1:
              raise SystemExit("Could not find worker configuration; refusing to commit a partial patch.")

          path.write_text(formatted, encoding="utf-8")
          print(f"Formatted {payload_count} embedded payload block(s); worker settings fixed.")
          PY

      - name: Commit and push patch
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No change was required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Format embedded payloads and fix startup settings"
          git push
