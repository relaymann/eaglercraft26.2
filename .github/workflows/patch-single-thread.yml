name: Patch Eaglercraft single-thread startup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-single-thread.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch worker settings without rewriting embedded payloads
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r'(?m)^(\s*singleThreadMode:\s*true,\n)'
              r'\s*serverWorker:\s*[^\n]+\n'
              r'\s*meshWorkers:\s*[^\n]+(?:\n\s*&&[^\n]+)?'
          )
          replacement = (
              r'\1'
              r'\t\t\tserverWorker: false,\n'
              r'\t\t\tmeshWorkers: false'
          )

          patched, count = pattern.subn(replacement, html, count=1)
          if count != 1:
              raise SystemExit(
                  "Could not find the expected singleThreadMode/serverWorker/"
                  "meshWorkers block. No changes were made."
              )

          path.write_text(patched, encoding="utf-8")
          print("Patched index.html worker settings; embedded payloads preserved.")
          PY

      - name: Commit and push patch
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No change was required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix single-thread worker startup configuration"
          git push
