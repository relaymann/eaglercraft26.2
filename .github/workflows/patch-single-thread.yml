name: Format embedded Eaglercraft payloads

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-single-thread.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Format HTML and embedded payloads safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          # Match payloads whether the Base64 starts on the tag line or the next line.
          payload_pattern = re.compile(
              r'(<script\b(?=[^>]*\btype="application/octet-stream")[^>]*>)(.*?)(</script\s*>)',
              re.DOTALL,
          )

          def wrap_payload(match):
              opening, payload, closing = match.groups()
              compact = "".join(payload.split())
              if not compact:
                  return match.group(0)
              lines = "\n" + "\n".join(
                  compact[i:i + 76] for i in range(0, len(compact), 76)
              ) + "\n"
              return opening + lines + closing

          formatted, payload_count = payload_pattern.subn(wrap_payload, html)
          if payload_count < 1:
              raise SystemExit("No embedded application/octet-stream payloads found.")

          # These settings may already be fixed; tolerate that and only patch if needed.
          single_thread = re.search(
              r'(?m)^([ \t]*)singleThreadMode:[ \t]*true,\s*\n'
              r'([ \t]*)serverWorker:[ \t]*([^,\n]+),\s*\n'
              r'([ \t]*)meshWorkers:[ \t]*([^\n]+)',
              formatted,
          )
          if single_thread:
              indent1, indent2, server_value, indent3, mesh_value = single_thread.groups()
              start, end = single_thread.span()
              replacement = (
                  indent1 + "singleThreadMode: true,\n"
                  + indent2 + "serverWorker: false,\n"
                  + indent3 + "meshWorkers: false"
              )
              formatted = formatted[:start] + replacement + formatted[end:]

          path.write_text(formatted, encoding="utf-8")
          print(f"Formatted {payload_count} embedded payload block(s).")
          PY

      - name: Commit and push patch
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No change was required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Format embedded payloads in HTML"
          git push
